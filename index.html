<div class="toast" id="toast" role="status"></div>
<script>
const APP = "https:" + "//script.google.com/macros/s/AKfycbxMKgTgxIBiiADxzGp-1HrBDD132EjyS7Wm__ihDRz2i_uwUnhrGaupFCTf0folbsSHoQ/exec";
const KEY = new URLSearchParams(location.search).get("k") || "";
const api = body => fetch(APP, {method: "POST", credentials: "omit", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body)}).then(r => r.json());
let SESS = {t: "", e: 0};
(function () {
  const app = document.getElementById("app"), back = document.getElementById("back"), LS = "uc_pin_" + KEY;
  const direct = () => location.replace(APP + location.search + location.hash);
  if (back) back.style.visibility = "hidden";
  app.innerHTML = '<p class="lk-wait">보고서를 여는 중이에요…</p>';
  if (!KEY) { app.innerHTML = '<p class="lk-wait">보고서를 찾을 수 없어요.<br>받으신 카카오톡 링크를 다시 눌러 주세요.</p>'; return; }
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS) || "null"); } catch (_) {}
  const open = r => { SESS = {t: r.st || "", e: r.se || 0}; if (back) back.style.visibility = ""; startApp(r.data); };
  const ui = msg => {
    app.innerHTML = '<section class="lk"><div class="lk-ico">🔒</div><h1>대표님 확인</h1><p class="lk-sub">보고서를 보시려면 대표님 <b>생년월일 6자리</b>를 입력해 주세요.</p>'
      + '<form id="lkf" autocomplete="off"><input id="lkp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="예) 750315" aria-label="생년월일 6자리">'
      + '<label class="lk-rem"><input type="checkbox" id="lkr" checked> 이 기기에서 30일 동안 다시 묻지 않기</label>'
      + '<button type="submit" id="lkb">보고서 열기</button><p class="lk-msg" id="lkm" role="alert">' + (msg || "") + '</p></form>'
      + '<p class="lk-foot">생년월일은 확인에만 쓰이고 저장되지 않아요.<br>문의: 유창세무회계 담당자</p></section>';
    const f = document.getElementById("lkf"), p = document.getElementById("lkp"), b = document.getElementById("lkb"), m = document.getElementById("lkm");
    p.focus();
    f.addEventListener("submit", ev => {
      ev.preventDefault(); const pin = p.value.replace(/\D/g, "");
      if (pin.length !== 6) { m.textContent = "생년월일 6자리를 입력해 주세요."; return; }
      b.disabled = true; b.textContent = "확인 중…"; m.textContent = "";
      const rem = document.getElementById("lkr").checked;
      api({action: "unlock", k: KEY, pin: pin, remember: rem}).then(r => {
        if (r && r.ok) { if (rem && r.t) { try { localStorage.setItem(LS, JSON.stringify({t: r.t, e: r.e})); } catch (_) {} } open(r); }
        else { b.disabled = false; b.textContent = "보고서 열기"; p.value = ""; m.textContent = (r && r.msg) || "다시 시도해 주세요."; if (r && r.left === 0) b.disabled = true; }
      }).catch(() => { b.disabled = false; b.textContent = "보고서 열기"; m.textContent = "연결이 불안정해요. 다시 시도해 주세요."; });
    });
  };
  const ok = saved && saved.t && saved.e > Date.now();
  api({action: "open", k: KEY, t: ok ? saved.t : "", e: ok ? saved.e : 0}).then(r => {
    if (r && r.ok) open(r);
    else if (r && (r.locked || r.expired)) { if (r.expired) { try { localStorage.removeItem(LS); } catch (_) {} } ui(); }

function startApp(RAW) {

  return {amt, cnt, T: Object.keys(amt)}; }
function cols(u){
  if (u === "m") return [M, M - 1, M - 2].filter(m => m >= 1).map(m => ({l: `${Y}년 ${mm(m)}월`, ms: [m]}));
  const size = {q: 3, h: 6, y: 12}[u], idx = Math.ceil(M / size), part = M < idx * size ? ` (~${M}월)` : "";

    const cardBase = gross(RAW.S, ["17","22"], ms), card = Math.max(0, Math.min(Math.floor(cardBase * .013), CARD_LIMIT, base - inCred));
    const sRows = Object.keys(RAW.S).map(k => [RAW.S[k].label, gross(RAW.S, [k], ms)]).filter(r => r[1]);

function book(side){

    .filter(r => (r.a || r.b) && (fl === "all" || (fl === "dn" ? r.d < 0 : r.d > 0))).sort((x, y) => y.a - x.a);
  const ta = sum(all.map(c => sum(A_.map(m => c.m[m - 1])))), tb = sum(all.map(c => sum(B_.map(m => c.m[m - 1]))));
  const T = {a: sum(rows.map(r => r.a)), b: sum(rows.map(r => r.b)), ac: sum(rows.map(r => r.ac)), bc: sum(rows.map(r => r.bc))};

  ${rows.length ? `<div class="scroll"><table class="pt bk"><thead><tr><th class="rh">거래처명</th><th>${q}분기 (A)<small>${mm(A_[0])}~${mm(A_[2])}월</small></th><th>지난 분기 (B)</th><th>총 합계<small>(A)+(B)</small></th><th>전기대비 차액<small>(A)−(B)</small></th></tr></thead><tbody>

}

  <div class="addrow"><label class="add">＋ 카드 사진으로 등록<input type="file" data-up="card" accept="${"image/"}*"></label><label class="add">＋ 통장 사진으로 등록<input type="file" data-up="account" accept="${"image/"}*"></label></div>
  <p class="note">새로 만든 사업용 카드 앞면이나 통장 첫 장을 찍어 보내 주세요. 담당자가 확인한 뒤 등록하고 여기에 표시해 드려요.</p>`; };
async function prep(file){
  try { const img = await createImageBitmap(file), s = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.85); }
  catch (_) { return await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); }); } }
const send = (kind, file) => prep(file).then(d => api({action: "upload", k: RAW.k, kind: kind, name: file.name, data: d, t: SESS.t, e: SESS.e})).then(r => { if (!r || !r.ok) throw new Error((r && r.msg) || "fail"); return r; });
let shots = [];
V.receipt = () => { const C = cols(st.rcu ?? "m"), kk = st.rcK ?? "b", PP = RAW.paper[kk];
  const types = ["간이영수증","종이세금계산서","종이계산서"], rows = types.map(t => ({n: t, v: C.map(c => PP[t] ? [sum(c.ms.map(m => PP[t].a[m - 1])), sum(c.ms.map(m => PP[t].n[m - 1]))] : [0, 0])}));
  rows.push({n: `총${kk === "b" ? "매입" : "매출"}`, tot: 1, v: C.map((c, i) => [sum(rows.map(r => r.v[i][0])), sum(rows.map(r => r.v[i][1]))])});
  const mon = side => sum(Object.values(RAW.paper[side]).map(p => p.a[M - 1]));
  const useRows = Object.entries(RAW.A).map(([acct, o]) => ({n: esc(acct), v: C.map(c => [sum(c.ms.map(m => o.a[m - 1])), sum(c.ms.map(m => o.n[m - 1]))])})).filter(r => r.v.some(x => x[0])).sort((x, y) => y.v[0][0] - x.v[0][0]);
  const nm = M + 1, ny = nm > 12 ? Y + 1 : Y, nmm = nm > 12 ? 1 : nm;
  const sched = [[10, "원천세", `${M}월 지급분`, "원천징수 소득세 신고·납부 기한 (지급분이 있을 때)"]].concat(nmm === 11 ? [[30, "종합소득세", `${Y}년 중간예납`, "종합소득세 중간예납세액 납부 기한"]] : []).concat(nmm === 1 ? [[25, "부가가치세", `${Y}년 확정신고`, "부가가치세 확정신고·납부 기한"]] : []).concat(nmm === 7 && !GANI ? [[25, "부가가치세", `${Y}년 1기 확정신고`, "부가가치세 확정신고·납부 기한"]] : []);
  return head("영수증 보고서", [...base, ["분석기간", span(M, M)]], "경조사비, 종이세금계산서, 간이영수증 같은 수기 증빙을 보내주세요. 빠짐없이 장부에 반영할게요.") +
  `<p class="big">${mm(M)}월에 등록된 수기 영수증은<br>매출 기준 <b>${wonf(mon("s"))}</b><br>매입 기준 <b>${wonf(mon("b"))}</b>이에요.</p>
  <div class="tip"><p><b>경조사비·간이영수증도 비용이 될 수 있어요.</b><br>청첩장·부고 문자, 간이영수증을 사진으로 보내주시면 담당자가 경비 처리 여부를 확인해 드려요.</p>
  <label class="cta">영수증 등록하러 가기<input type="file" id="shot" accept="${"image/"}*" multiple></label><div class="thumbs">${shots.map(x => `<figure><img src="${x.u}" alt="올린 영수증"><figcaption>${x.s === "ok" ? "보냄" : x.s === "fail" ? "실패" : "보내는 중"}</figcaption></figure>`).join("")}</div>
  ${shots.length ? `<p class="note">사진 ${shots.filter(x => x.s === "ok").length}장을 보냈어요. 담당자가 확인해서 장부에 반영할게요.</p>` : ""}</div>
  ${acList()}
  <h2>이달의 세무일정</h2><h3 class="h3" style="border-bottom:1px solid var(--ink);padding-bottom:8px">${mm(nmm)}월</h3>
  ${sched.map(([d, t, s1, s2]) => `<div class="sch"><div class="day"><b>${mm(d)}</b><small>${DOW[new Date(ny, nmm - 1, d).getDay()]}요일</small></div><div><span class="st">${t}</span><b>${s1}</b><br>${s2}</div></div>`).join("")}
  <p class="note">기한이 토요일·공휴일이면 다음 영업일까지예요.</p>
  <h2>수기 증빙 집계</h2><p class="note" style="margin-top:-6px;text-align:right">* 거래일자 기준</p>
  ${seg("rcK", [["b","매입"],["s","매출"]], "b")}${unitTabs("rcu")}${ptable(C.map(c => c.l), rows)}
  <h2>용도별 현황</h2><p class="note" style="margin-top:-6px">* 전체 매입 증빙을 계정과목별로 보여드려요</p>${useRows.length ? ptable(C.map(c => c.l), useRows) : `<p class="empty">매입 내역이 없어요.</p>`}`; };

// ---------- 그래프 ----------
let charts = [];
const box2 = svg => [svg.clientWidth, svg.clientHeight];
const ticks = (W, x, H) => { let s = ""; for (let i = 0; i < 12; i++) if (W >= 420 || i % 2 === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--soft)">${i + 1}월</text>`; return s; };
function bar(key, arr, lyAvg){ let sel = arr.length - 1; const c = {key, pick(i){ sel = Math.min(i, arr.length - 1); c.draw(); }, draw(){
  const svg = $("c-" + key); if (!svg) return; const [W, H] = box2(svg); if (!W || !H) return;
  const top = Math.max(...arr, lyAvg || 0, 0.0001) * 1.12, bot = Math.min(0, ...arr) * 1.12, pl = 6, pr = 6, pt = 12, pb = 28, cw = (W - pl - pr) / 12, bw = Math.min(26, cw * .56);
  const y = v => pt + (H - pt - pb) * (top - v) / (top - bot), x = i => pl + cw * i + cw / 2, avgA = sum(arr) / arr.length;
  let s = `<rect x="${pl + cw * sel}" y="${pt}" width="${cw}" height="${H - pt - pb}" fill="var(--card)" rx="6"/><line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  if (lyAvg) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(lyAvg)}" y2="${y(lyAvg)}" stroke="var(--gray)" stroke-width="2.5" stroke-dasharray="5 5"/>`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(avgA)}" y2="${y(avgA)}" stroke="var(--acc)" stroke-dasharray="5 5" opacity=".7"/>`;
  arr.forEach((v, i) => { s += `<rect x="${x(i) - bw / 2}" y="${Math.min(y(v), y(0))}" width="${bw}" height="${Math.max(1, Math.abs(y(v) - y(0)))}" rx="5" fill="var(--acc)"/>`; });
  svg.innerHTML = s + ticks(W, x, H);
  const p = $("p-" + key); if (p) p.innerHTML = `<b>${sel + 1}월</b>${lyAvg ? `<span>작년 월평균 <span class="num">${sman(lyAvg)}</span></span>` : ""}<span>올해 <span class="num">${sman(arr[sel])}</span></span>`;
}}; return c; }
function cum(key, arr, lyAvg){ return {key, draw(){
  const svg = $("c-" + key); if (!svg) return; const [W, H] = box2(svg); if (!W || !H) return;
  const run = a => a.reduce((o, v) => (o.push((o.length ? o[o.length - 1] : 0) + v), o), []), ca = run(arr), n = arr.length, avg = ca[n - 1] / n, proj = [], cl = lyAvg ? Array.from({length: 12}, (_, i) => lyAvg * (i + 1)) : [];
  for (let i = n - 1; i < 12; i++) proj.push([i, ca[n - 1] + avg * (i - n + 1)]);
  const e = proj[proj.length - 1][1], top = Math.max(...cl, e, ...ca, 0.0001) * 1.1, bot = Math.min(0, ...ca, e), pl = 6, pr = 10, pt = 12, pb = 28, cw = (W - pl - pr) / 12;
  const y = v => pt + (H - pt - pb) * (top - v) / (top - bot), x = i => pl + cw * i + cw / 2, r = W < 520 ? 3 : 4;
  let s = `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  if (cl.length) s += `<polyline fill="none" stroke="var(--gray)" stroke-width="2.5" points="${cl.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
  s += `<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="6 6" points="${proj.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}"/><polyline fill="none" stroke="var(--acc)" stroke-width="3" points="${ca.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>` + ca.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${r}" fill="var(--acc)"/>`).join("");
  s += `<text x="${x(11)}" y="${Math.max(14, y(e) - 10)}" text-anchor="end" font-size="12" fill="var(--acc)" font-weight="700">예상 ${sman(e)}</text>`;
  svg.innerHTML = s + ticks(W, x, H); }}; }
function qbar(key, vals){ return {key, draw(){
  const svg = $("c-" + key); if (!svg) return; const [W, H] = box2(svg); if (!W || !H) return;
  const labels = ["1분기","2분기","3분기","4분기"], cw = (W - 12) / 4, top = Math.max(...vals.filter(v => v != null).map(Math.abs), 1) * 1.25, pt = 22, pb = 30, y = v => pt + (H - pt - pb) * (1 - Math.abs(v) / top), bw = Math.min(40, cw * .45);
  let s = `<line x1="6" x2="${W - 6}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => { const cx = 6 + cw * i + cw / 2, col = v < 0 ? COL.b : COL.s; s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="12" fill="var(--soft)">${labels[i]}</text>`;
    if (v == null) return; s += `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="5" fill="${col}"/><text x="${cx}" y="${y(v) - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${wonf(v)}</text>`; });
  svg.innerHTML = s; }}; }
const mount = {
  biz: () => [bar("pm", P()), cum("cum", P())],
  sales: () => [bar("m", D.sales, D.lySalesAvg), cum("cum", D.sales, D.lySalesAvg)],
  buy: () => [bar("m", D.buy), cum("cum", D.buy)],
  pay: () => [bar("pay", D.payM, D.lyPayAvg)],
  vat: () => [qbar("vq", V.vat.q)]
};
const ACC = {biz: "var(--blue2)", sales: COL.s, buy: COL.b, pay: COL.p, vat: COL.s, vatfile: COL.s, salesbook: COL.s, buybook: COL.b, receipt: COL.s};
const ro = new ResizeObserver(() => charts.forEach(c => c.draw()));
let cur = "", route = (typeof location !== "undefined" && location.hash.slice(1)) || "home";
function show(keep){
  let r = route; if (!V[r]) r = "home";
  const sy = window.scrollY;
  document.documentElement.style.setProperty("--acc", ACC[r] || "var(--blue2)");
  $("app").innerHTML = V[r]();
  $("back").style.visibility = r === "home" ? "hidden" : "visible";
  ro.disconnect(); charts = mount[r] ? mount[r]() : [];
  charts.forEach(c => { ro.observe($("c-" + c.key)); c.draw(); });
  if (keep && cur === r) window.scrollTo(0, sy); cur = r;
}
let tt;
const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); };
$("app").addEventListener("click", e => {
  const f = e.target.closest(".fig");
  if (f) { const c = charts.find(c => c.key === f.dataset.k); if (c && c.pick) { const b = f.getBoundingClientRect(); c.pick(Math.max(0, Math.floor((e.clientX - b.left - 6) / ((b.width - 12) / 12)))); } return; }
  const s = e.target.closest("[data-st]"); if (s) { const [k, v] = s.dataset.st.split(":"); st[k] = v || undefined; show(true); return; }
  if (e.target.closest("[data-file]")) toast("첨부 파일 연결은 다음 단계에서 준비돼요");
});
$("app").addEventListener("change", async e => { const inp = e.target, kind = inp.id === "shot" ? "receipt" : inp.dataset && inp.dataset.up; if (!kind) return;
  const files = [...inp.files].slice(0, 10); if (!files.length) return; let okN = 0, bad = 0;
  for (const f of files) {
    const it = kind === "receipt" ? {u: URL.createObjectURL(f), s: "up"} : {k: kind === "card" ? "카드" : "계좌", bank: "", name: "", num: "", st: "올리는 중", d: ""};
    (kind === "receipt" ? shots : pend).push(it); show(true);
    try { await send(kind, f); okN++; if (kind === "receipt") it.s = "ok"; else { it.st = "등록 요청"; const t = new Date(); it.d = (t.getMonth() + 1) + "." + t.getDate(); } }
    catch (err) { bad++; if (kind === "receipt") it.s = "fail"; else it.st = "실패"; }
    show(true); }
  toast(bad ? "사진을 보내지 못했어요. 잠시 뒤 다시 해 주세요." : `사진 ${okN}장을 보냈어요. 담당자가 확인할게요.`); });
let QP = {};
const GS = typeof google !== "undefined" && google.script && google.script.history;
function go(r){ route = r; if (GS) { try { google.script.history.push({r: r}, QP, r); } catch (_) {} } else { history.pushState({r: r}, "", "#" + r); } show(); window.scrollTo(0, 0); }
document.addEventListener("click", e => { const a = e.target.closest('a[href^="#"]'); if (!a) return; e.preventDefault(); go(a.getAttribute("href").slice(1) || "home"); }, true);
if (GS) {
  google.script.history.setChangeHandler(e => { route = (e.state && e.state.r) || e.location.hash || "home"; show(); window.scrollTo(0, 0); });
  google.script.url.getLocation(l => { QP = l.parameter || {}; if (l.hash && V[l.hash] && l.hash !== route) { route = l.hash; show(); } });
} else {
  window.addEventListener("popstate", () => { route = location.hash.slice(1) || "home"; show(); window.scrollTo(0, 0); });
}
show();
}
